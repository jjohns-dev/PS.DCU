name: release
run-name: release

on:
  push:
    tags:
      - "v[0-9].[0-9]+.[0-9]+" # v1.0.0
  pull_request:
    branches: ["*"]

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/release.yml@ce0d6e57a3ef0ec03f241a1ededbc6fe0eb8d211 # pwsh-module-ci#77 e2e
    with:
      artifact-name: ${{ github.event_name == 'pull_request' && 'PS.DCU-dry-run' || 'Artifacts' }}
      dry-run: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write
