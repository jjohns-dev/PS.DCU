name: ci
run-name: ci

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/ci.yml@v1
    with:
      os-matrix: '["windows-latest"]'
      min-tests: 9999 # SABOTAGE 85 collected - min(floor(85 * 0.05), 10)
    permissions:
      contents: read
      checks: write
