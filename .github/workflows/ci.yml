name: ci
run-name: ci

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/ci.yml@v2
    with:
      os-matrix: '["windows-latest"]'
      min-tests: 52 # 54 executed - min(floor(54 * 0.05), 10) = 54 - 2
    permissions:
      contents: read
      checks: write
