name: ci
run-name: ci

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/ci.yml@v2
    with:
      os-matrix: '["windows-latest"]'
      min-tests: 77 # 81 collected - min(floor(81 * 0.05), 10) = 81 - 4
    permissions:
      contents: read
      checks: write
