name: ci
run-name: ci

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/ci.yml@ce0d6e57a3ef0ec03f241a1ededbc6fe0eb8d211 # pwsh-module-ci#77 e2e
    with:
      os-matrix: '["windows-latest"]'
      min-tests: 76 # 79 collected - min(floor(79 * 0.05), 10) = 79 - 3
    permissions:
      contents: read
      checks: write
